# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — deliberately scoped to schedule exceptions only.
# Everything else on this site (gear, guides) is plain files edited in the repo.
#
# Auth is "Sign In with Token" with a GitHub personal access token. No OAuth app
# and no auth server: the CMS runs entirely in the browser and talks to the
# GitHub API as you. Do NOT switch this to PKCE — GitHub has that on hold and
# Sveltia cannot support it yet.

backend:
  name: github
  repo: KeodaCZ/keoda.cz
  branch: main
  # Commits land straight on main, which triggers the deploy workflow.
  commit_messages:
    update: 'Kalendář: úprava výjimek'
    delete: 'Kalendář: smazání výjimky'

# The CMS never uploads images, but Sveltia wants these defined.
media_folder: public/uploads
public_folder: /uploads

# Single-user CMS — no editorial review workflow.
publish_mode: simple

collections:
  - name: kalendar
    label: Kalendář streamů
    format: json
    # The preview pane is rendered by public/admin/preview.js — the default
    # one relisted the same fields one per line and ate half the screen.
    files:
      - name: vyjimky
        label: Výjimky v rozvrhu
        file: data/exceptions.json
        description: >-
          Pravidelný rozvrh (Po, St, Pá, So, Ne od 18:30) je natvrdo v repu a
          tady se needituje. Sem se píšou jen odchylky od něj: zrušený stream,
          jiný čas, bonus ve volný den, nebo jen doplnění hry a poznámky.
          Prázdný seznam je normální stav. Minulá data se přestanou zobrazovat
          sama, takže se nic neuklízí.
        fields:
          - name: exceptions
            label: Výjimky
            label_singular: Výjimka
            widget: list
            required: false
            # Start collapsed: three short rows beat one form taller than the
            # screen. `summary` only interpolates values — no conditionals — so
            # the toggles are shown in the custom preview instead (preview.js).
            collapsed: true
            # Note before game, matching the site since 2026-09-10: the note is
            # the headline there and the game the label underneath it.
            summary: '{{fields.date}} · {{fields.status}} {{fields.start}} {{fields.note}} {{fields.game}}'
            fields:
              - name: date
                label: Datum
                widget: datetime
                time_format: false
                # Stored as a plain date; shown Czech-style in the picker.
                format: 'YYYY-MM-DD'
                date_format: 'DD.MM.YYYY'
                # Date-only fields must not shift with the visitor's timezone.
                picker_utc: true

              - name: status
                label: Co se děje
                widget: select
                required: false
                default: ''
                options:
                  - { label: 'Stream se koná', value: '' }
                  - { label: 'Nestreamuju', value: 'off' }

              - name: start
                label: Začátek
                widget: string
                required: false
                hint: 'Formát 20:00. Prázdné = pravidelný čas 18:30.'
                pattern: ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Zadej čas ve formátu 20:00']

              - name: timeUnknown
                label: Čas ještě nevím
                widget: boolean
                required: false
                default: false
                hint: V kalendáři bude místo času pomlčka.

              - name: note
                label: Popis
                widget: string
                required: false
                hint: >-
                  Hlavní řádek v kalendáři, např. „Dohrajeme Wolverina“ nebo
                  „svatba“. Když ho nevyplníš, je nadpisem hra.

              - name: game
                label: Hra
                widget: string
                required: false
                hint: >-
                  Menším písmem pod popisem. Bez popisu je nadpisem ona,
                  místo slova „Stream“.

              - name: highlight
                label: Zmínit v banneru na hlavní stránce
                widget: boolean
                required: false
                default: false
                hint: >-
                  Jediná cesta do banneru. Bez zaškrtnutí je změna vidět jen
                  v kalendáři — i zrušený stream.

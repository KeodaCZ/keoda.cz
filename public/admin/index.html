<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep the admin UI out of search results. It holds no secrets, but it
         has no business being indexed either. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>KeodaCZ — správa kalendáře</title>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <!-- Compact preview pane for the schedule. Uses the createClass/h globals
         the CMS provides, so no React script is needed.
         Bump ?v= whenever preview.js changes: files under public/ are served
         unhashed, so without it the browser keeps a cached copy after a deploy
         and the change appears to have done nothing. -->
    <script src="/admin/preview.js?v=3"></script>
  </body>
</html>

<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep the admin UI out of search results. It holds no secrets, but it
         has no business being indexed either. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>KeodaCZ — správa kalendáře</title>
  </head>
  <body>
    <!-- PIN THE VERSION. This was unpinned until 2026-09-11, which means every
         page load fetched whatever Sveltia had released most recently — a live
         third-party dependency that could, and did, break the admin with no
         change on our side. Saving started failing that afternoon; the owner's
         last working save was the day before, and 0.209.2 and 0.210.0 had been
         published in between.

         Upgrade deliberately: bump the number, open /admin, and actually save
         something before pushing. Never go back to an unpinned URL. -->
    <script src="https://unpkg.com/@sveltia/cms@0.209.1/dist/sveltia-cms.js"></script>
    <!-- Compact preview pane for the schedule. Uses the createClass/h globals
         the CMS provides, so no React script is needed.

         The URL is built at load time on purpose. Files under public/ ship
         unhashed AND this page is itself cached, so a hard-coded ?v= bump never
         reaches the browser — it keeps the old page, which asks for the old
         script. A timestamp fixes it for every load from here on.
         document.write keeps this synchronous, so the CMS globals above are
         ready before preview.js runs. -->
    <script>
      document.write(
        '<script src="/admin/preview.js?t=' + Date.now() + '"><\/script>'
      );
    </script>
  </body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made with GITHUB_TOKEN deliberately does not trigger other
  # workflows, so the content jobs' own commits would otherwise sit unpublished
  # until the next cron run — up to twelve hours for a clip made this evening.
  # workflow_run is the intended way across that boundary.
  #
  # It fires even when the content run committed nothing, so this costs a few
  # redundant deploys a day. That is the accepted price: a redeploy is
  # idempotent and free on a public repo, and there is no way to read whether
  # the triggering run actually changed anything.
  workflow_run:
    workflows: ['Fetch content', 'Reconcile clips']
    types: [completed]
  # Times below are UTC. 22:20 UTC is 00:20 Prague in summer; 23:20 UTC is
  # 00:20 Prague in winter. So whichever the season, one of the two lands just
  # after Prague midnight and the other is a harmless extra.
  #
  # This used to be what rolled "Dnes" over in the calendar, and it was never
  # good enough at it: GitHub runs these one to two hours late in practice, so
  # the nightly build actually landed around 02:00 Prague and until then the
  # page called yesterday "Dnes". The calendar now decides "today" in the
  # browser (see ScheduleCompact/ScheduleFull), so a late or missed run can no
  # longer mislabel a day.
  #
  # Kept anyway, for the things still rendered against build-time "today":
  # the schedule banner, and which .ics files exist.
  schedule:
    - cron: '20 22 * * *'
    - cron: '20 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Don't publish off the back of a content run that failed. Skipping here
    # skips build and deploy too, since both depend on this job.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
